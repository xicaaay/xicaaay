<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B0C"/>
      <stop offset="1" stop-color="#111415"/>
    </linearGradient>
    <radialGradient id="accentGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(935 212) rotate(90) scale(180)">
      <stop stop-color="#469DF4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#469DF4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#1C2224" stroke-width="1"/>
    </pattern>
    <filter id="eyeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#surface)"/>
  <rect width="1200" height="430" rx="30" fill="url(#grid)" opacity="0.72"/>
  <rect x="1" y="1" width="1198" height="428" rx="29" stroke="#303638" stroke-width="2"/>

