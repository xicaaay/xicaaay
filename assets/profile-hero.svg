<svg width="1100" height="250" viewBox="0 0 1100 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Imaginemos algo. Hagámoslo realidad.</title>
  <desc id="desc">Presentación de Amilcar Xicay, desarrollador de software Full Stack de Guatemala.</desc>
  <style>
    .first { fill: #01203f; animation: rise .65s cubic-bezier(.22,1,.36,1) both; }
    .second { fill: #0344dc; animation: rise .65s .12s cubic-bezier(.22,1,.36,1) both; }
    .meta { fill: #40566b; animation: rise .65s .24s cubic-bezier(.22,1,.36,1) both; }
    .line { stroke: #0344dc; transform-origin: left; animation: draw .8s .34s cubic-bezier(.22,1,.36,1) both; }
    @media (prefers-color-scheme: dark) {
      .first { fill: #eef4ed; }
      .second { fill: #a8c3ff; }
      .meta { fill: #a8c3ff; }
      .line { stroke: #5f8df3; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .first, .second, .meta, .line { animation: none; }
    }
  </style>

  <text class="first" x="550" y="76" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" text-anchor="middle">
    Imaginemos algo.
  </text>
  <text class="second" x="550" y="147" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" text-anchor="middle">
    Hagámoslo realidad.
  </text>
  <line class="line" x1="300" y1="181" x2="800" y2="181" stroke-width="3"/>
  <text class="meta" x="550" y="220" font-family="'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">
    AMILCAR XICAY · FULL STACK DEVELOPER · GUATEMALA
  </text>
</svg>
