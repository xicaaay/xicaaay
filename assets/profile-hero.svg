<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Amilcar Xicay — Full Stack Developer</title>
  <desc id="desc">Portada animada con una retícula técnica, título editorial y personaje digital.</desc>
  <style>
    :root {
      --bg: #f3f3ef;
      --surface: #fafaf7;
      --ink: #090a0b;
      --muted: #606466;
      --subtle: #8d9294;
      --line: #d6d6d0;
      --line-strong: #a7a9a6;
      --accent: #2488ef;
      --panel: #050606;
      --panel-ink: #f3f4ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090b0c;
        --surface: #111415;
        --ink: #f3f4ef;
        --muted: #a8adae;
        --subtle: #73797b;
        --line: #1c2224;
        --line-strong: #303638;
        --accent: #469df4;
      }
    }
    .grid {
      animation: grid-drift 18s linear infinite;
    }
    .intro, .word, .name-row, .description, .panel {
      opacity: 0;
      animation: reveal .75s cubic-bezier(.22,1,.36,1) forwards;
    }
    .intro { animation-delay: .05s; }
    .word-1 { animation-delay: .16s; }
    .word-2 { animation-delay: .28s; }
    .name-row { animation-delay: .42s; }
    .description { animation-delay: .52s; }
    .panel { animation-delay: .32s; }
    .outline {
      fill: transparent;
      stroke: var(--ink);
      stroke-width: 2.2;
      stroke-dasharray: 860;
      stroke-dashoffset: 860;
      animation: draw 1.25s cubic-bezier(.22,1,.36,1) .55s forwards;
    }
    .eye-glow {
      animation: eye-pulse 2.6s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .character {
      animation: float 4.5s ease-in-out infinite;
      transform-origin: 970px 263px;
    }
    .scan {
      animation: scan 4.2s ease-in-out infinite;
    }
    .status {
      animation: status-pulse 1.8s ease-in-out infinite;
    }
    .particle {
      animation: particle-float 7s ease-in-out infinite;
    }
    .p2 { animation-delay: -1.4s; animation-duration: 8.5s; }
    .p3 { animation-delay: -2.8s; animation-duration: 6.5s; }
    .p4 { animation-delay: -4.2s; animation-duration: 9s; }
    .p5 { animation-delay: -5.6s; animation-duration: 7.5s; }
    .p6 { animation-delay: -3.4s; animation-duration: 10s; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes grid-drift { to { transform: translate(60px, 60px); } }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes eye-pulse {
      0%, 100% { opacity: .82; transform: scaleY(1); }
      47% { opacity: 1; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(.08); }
      54% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes scan {
      0%, 12% { transform: translateY(-240px); opacity: 0; }
      18% { opacity: .45; }
      75% { opacity: .18; }
      82%, 100% { transform: translateY(240px); opacity: 0; }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    @keyframes particle-float {
      0%, 100% { transform: translate3d(0, 0, 0); opacity: .18; }
      50% { transform: translate3d(8px, -13px, 0); opacity: .72; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .intro, .word, .name-row, .description, .panel { opacity: 1; }
      .outline { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="var(--line)" stroke-width="1"/>
    </pattern>
    <radialGradient id="panel-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(972 250) rotate(90) scale(188)">
      <stop stop-color="#469DF4" stop-opacity=".15"/>
      <stop offset="1" stop-color="#469DF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#469DF4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#469DF4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#469DF4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel-clip"><rect x="842" y="58" width="302" height="384" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="500" rx="28" fill="var(--bg)"/>
  <g class="grid"><rect x="-60" y="-60" width="1320" height="620" fill="url(#grid-pattern)" opacity=".7"/></g>
  <g fill="var(--accent)">
    <circle class="particle p1" cx="32" cy="236" r="2"/>
    <circle class="particle p2" cx="766" cy="91" r="2.5"/>
    <circle class="particle p3" cx="794" cy="398" r="1.8"/>
    <circle class="particle p4" cx="1138" cy="26" r="2"/>
    <circle class="particle p5" cx="1170" cy="472" r="2.5"/>
    <circle class="particle p6" cx="540" cy="472" r="1.7"/>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="27" stroke="var(--line-strong)" stroke-width="2"/>

  <g class="intro">
    <text x="52" y="55" fill="var(--accent)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.2">00 / PORTADA</text>
    <text x="707" y="55" text-anchor="end" fill="var(--subtle)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.4">XICAY.DEV · PORTFOLIO</text>
  </g>

  <g font-family="'Arial Black', Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="-5">
    <text class="word word-1" x="50" y="171" fill="var(--ink)">FULL STACK</text>
    <text class="outline" x="50" y="255">DEVELOPER</text>
  </g>

  <g class="name-row">
    <line x1="52" y1="302" x2="145" y2="302" stroke="var(--accent)" stroke-width="2"/>
    <text x="165" y="309" fill="var(--ink)" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Amilcar Xicay</text>
    <circle class="status" cx="684" cy="302" r="4" fill="var(--accent)"/>
    <text x="698" y="306" fill="var(--muted)" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" letter-spacing="1">AVAILABLE TO BUILD</text>
  </g>

  <g class="description" font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="362" fill="var(--muted)" font-size="17">Productos digitales completos: interfaces, sistemas, APIs e integraciones.</text>
    <text x="52" y="391" fill="var(--muted)" font-size="17">De la idea y la arquitectura al deploy.</text>
    <text x="52" y="448" fill="var(--subtle)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">FRONTEND · BACKEND · DATA · AUTOMATION</text>
  </g>

  <g class="panel">
    <rect x="842" y="58" width="302" height="384" rx="30" fill="var(--panel)" stroke="#303638" stroke-width="2"/>
    <rect x="842" y="58" width="302" height="384" rx="30" fill="url(#panel-glow)"/>
    <g clip-path="url(#panel-clip)">
      <rect class="scan" x="842" y="250" width="302" height="2" fill="url(#scan-gradient)"/>
    </g>
    <path d="M872 90h38M872 90v38M1114 410h-38M1114 410v-38" stroke="#F3F4EF" stroke-width="2" opacity=".75"/>
    <g class="character">
      <ellipse cx="993" cy="366" rx="73" ry="10" fill="#469DF4" opacity=".1"/>
      <circle cx="993" cy="250" r="89" fill="#111415" stroke="#F3F4EF" stroke-width="3"/>
      <circle cx="993" cy="250" r="79" stroke="#303638"/>
      <g class="eye-glow" filter="url(#glow)">
        <rect x="950" y="220" width="21" height="58" rx="10.5" fill="#469DF4"/>
        <rect x="1015" y="220" width="21" height="58" rx="10.5" fill="#469DF4"/>
      </g>
    </g>
    <text x="874" y="413" fill="#73797B" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" letter-spacing="1.5">BUILD / SHIP / IMPROVE</text>
  </g>
</svg>
