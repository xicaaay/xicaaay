<svg width="1080" height="360" viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Habilidades profesionales</title>
  <desc id="desc">Seis habilidades aparecen de forma escalonada con barras de color, pulsos y destellos animados.</desc>
  <style>
    :root {
      --bg:#f3f3ef; --surface:#fafaf7; --ink:#090a0b; --muted:#606466;
      --line:#d6d6d0; --blue:#2488ef; --purple:#8250df; --green:#238636; --orange:#bc4c00;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#090b0c; --surface:#111415; --ink:#f3f4ef; --muted:#a8adae;
        --line:#303638; --blue:#469df4; --purple:#bc8cff; --green:#3fb950; --orange:#ffa657;
      }
    }
    text { font-family:"JetBrains Mono",Consolas,monospace; }
    .card { opacity:0; animation:enter .58s cubic-bezier(.22,1,.36,1) forwards; }
    .c1{animation-delay:.10s}.c2{animation-delay:.22s}.c3{animation-delay:.34s}
    .c4{animation-delay:.46s}.c5{animation-delay:.58s}.c6{animation-delay:.70s}
    .accent {
      transform-box:fill-box;
      transform-origin:center bottom;
      transform:scaleY(0);
      animation:draw-accent .65s cubic-bezier(.22,1,.36,1) forwards;
    }
    .c1 .accent{animation-delay:.32s}.c2 .accent{animation-delay:.44s}.c3 .accent{animation-delay:.56s}
    .c4 .accent{animation-delay:.68s}.c5 .accent{animation-delay:.80s}.c6 .accent{animation-delay:.92s}
    .frame { animation:frame-pulse 5.4s ease-in-out infinite; }
    .c2 .frame{animation-delay:-4.5s}.c3 .frame{animation-delay:-3.6s}
    .c4 .frame{animation-delay:-2.7s}.c5 .frame{animation-delay:-1.8s}.c6 .frame{animation-delay:-.9s}
    .signal { animation:signal 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .c2 .signal{animation-delay:-.4s}.c3 .signal{animation-delay:-.8s}
    .c4 .signal{animation-delay:-1.2s}.c5 .signal{animation-delay:-1.6s}.c6 .signal{animation-delay:-2s}
    .orb { animation:drift 7s ease-in-out infinite alternate; }
    .orb-2 { animation-delay:-3.5s; }
    .scan { animation:scan 6s ease-in-out infinite; }
    @keyframes enter {
      from{opacity:0;transform:translateY(14px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes draw-accent { to{transform:scaleY(1)} }
    @keyframes frame-pulse {
      0%,82%,100%{stroke:var(--line)}
      90%{stroke:currentColor}
    }
    @keyframes signal {
      0%,100%{opacity:.35;transform:scale(.72)}
      50%{opacity:1;transform:scale(1.18)}
    }
    @keyframes drift { to{transform:translate(35px,-18px) scale(1.08)} }
    @keyframes scan {
      0%,10%{transform:translateX(-190px);opacity:0}
      18%{opacity:.32}
      70%{opacity:.16}
      78%,100%{transform:translateX(1120px);opacity:0}
    }
    @media (prefers-reduced-motion:reduce) {
      *{animation:none!important}
      .card{opacity:1}
      .accent{transform:scaleY(1)}
    }
  </style>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <linearGradient id="scan-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="var(--blue)" stop-opacity="0"/>
      <stop offset=".5" stop-color="var(--blue)"/>
      <stop offset="1" stop-color="var(--blue)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="board-clip"><rect x="1" y="1" width="1078" height="358" rx="20"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1078" height="358" rx="20" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <g clip-path="url(#board-clip)">
    <g filter="url(#blur)" opacity=".22">
      <circle class="orb" cx="170" cy="90" r="105" fill="var(--blue)"/>
      <circle class="orb orb-2" cx="920" cy="280" r="125" fill="var(--purple)"/>
    </g>
    <rect class="scan" x="-180" y="0" width="180" height="360" fill="url(#scan-gradient)" opacity=".2"/>
  </g>

  <text x="36" y="45" fill="var(--blue)" font-size="11" font-weight="700" letter-spacing="1.8">HABILIDADES / HUMAN LAYER</text>
  <text x="1044" y="45" text-anchor="end" fill="var(--muted)" font-size="10" letter-spacing="1.2">HOW I WORK</text>

  <g class="card c1" color="var(--blue)">
    <rect class="frame" x="36" y="75" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="36" y="75" width="5" height="98" rx="2.5" fill="var(--blue)"/>
    <circle class="signal" cx="332" cy="103" r="4" fill="var(--blue)"/>
    <text x="58" y="112" fill="var(--blue)" font-size="10">01 / ANALIZAR</text>
    <text x="58" y="143" fill="var(--ink)" font-size="14" font-weight="700">Resolución de problemas</text>
  </g>

  <g class="card c2" color="var(--purple)">
    <rect class="frame" x="377" y="75" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="377" y="75" width="5" height="98" rx="2.5" fill="var(--purple)"/>
    <circle class="signal" cx="673" cy="103" r="4" fill="var(--purple)"/>
    <text x="399" y="112" fill="var(--purple)" font-size="10">02 / APRENDER</text>
    <text x="399" y="143" fill="var(--ink)" font-size="14" font-weight="700">Aprendizaje continuo</text>
  </g>

  <g class="card c3" color="var(--green)">
    <rect class="frame" x="718" y="75" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="718" y="75" width="5" height="98" rx="2.5" fill="var(--green)"/>
    <circle class="signal" cx="1014" cy="103" r="4" fill="var(--green)"/>
    <text x="740" y="112" fill="var(--green)" font-size="10">03 / ADAPTAR</text>
    <text x="740" y="143" fill="var(--ink)" font-size="14" font-weight="700">Adaptabilidad</text>
  </g>

  <g class="card c4" color="var(--orange)">
    <rect class="frame" x="36" y="188" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="36" y="188" width="5" height="98" rx="2.5" fill="var(--orange)"/>
    <circle class="signal" cx="332" cy="216" r="4" fill="var(--orange)"/>
    <text x="58" y="225" fill="var(--orange)" font-size="10">04 / RESPONDER</text>
    <text x="58" y="256" fill="var(--ink)" font-size="13" font-weight="700">Responsabilidad y autonomía</text>
  </g>

  <g class="card c5" color="var(--blue)">
    <rect class="frame" x="377" y="188" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="377" y="188" width="5" height="98" rx="2.5" fill="var(--blue)"/>
    <circle class="signal" cx="673" cy="216" r="4" fill="var(--blue)"/>
    <text x="399" y="225" fill="var(--blue)" font-size="10">05 / PROPONER</text>
    <text x="399" y="256" fill="var(--ink)" font-size="14" font-weight="700">Proactividad</text>
  </g>

  <g class="card c6" color="var(--purple)">
    <rect class="frame" x="718" y="188" width="326" height="98" rx="13" fill="var(--surface)" stroke="var(--line)"/>
    <rect class="accent" x="718" y="188" width="5" height="98" rx="2.5" fill="var(--purple)"/>
    <circle class="signal" cx="1014" cy="216" r="4" fill="var(--purple)"/>
    <text x="740" y="225" fill="var(--purple)" font-size="10">06 / RAZONAR</text>
    <text x="740" y="256" fill="var(--ink)" font-size="12.5" font-weight="700">Pensamiento lógico y analítico</text>
  </g>

  <path d="M36 325h1008" stroke="var(--line)"/>
  <text x="36" y="340" fill="var(--muted)" font-size="9" letter-spacing="1.1">CRITERIO · CONSTANCIA · AUTONOMÍA · MEJORA CONTINUA</text>
</svg>
